spring.application.name=inventory-management
server.port=8080

# backend/.env dosyası varsa içindeki değerleri (DB_PASSWORD vb.) okur. Dosya git'e gönderilmez.
spring.config.import=optional:file:.env[.properties]

# --- Veritabanı (değerler backend/.env dosyasından okunur) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Europe/Istanbul

# --- JWT ---
# Base64 kodlu, en az 256 bit bir anahtar. Üretim ortamında mutlaka JWT_SECRET ile değiştirin.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- İlk açılışta oluşturulacak yönetici hesabı ---
app.admin.email=${ADMIN_EMAIL:admin@envanter.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# --- Güvenlik ---
# Art arda bu kadar hatalı denemeden sonra hesap lock-minutes dakika kilitlenir
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lock-minutes=${LOGIN_LOCK_MINUTES:15}
# Yöneticinin verdiği tek kullanımlık şifrenin geçerlilik süresi (saat)
app.security.temporary-password-hours=24

# --- Rezervasyon ---
# Ekipman başlangıçtan en fazla bu kadar dakika önce teslim alınabilir
app.reservation.check-out-early-minutes=30
# Başlangıçtan bu kadar dakika önce hatırlatma bildirimi gönderilir
app.reservation.reminder-minutes=60
# Kalibrasyonuna bu kadar gün kalan ekipmanlar her sabah yöneticilere bildirilir (zil)
app.calibration.warning-days=7

# --- Zamanlanmış işler ---
app.scheduler.enabled=true
app.scheduler.interval-ms=300000
app.scheduler.daily-cron=0 0 8 * * *

# --- Dosya yükleme (Excel içe aktarma) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
