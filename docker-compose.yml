# PostgreSQL'i Docker ile çalıştırmak için: docker compose up -d
# (Bilgisayarınızda kurulu bir PostgreSQL varsa bu dosyaya gerek yoktur.)
services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
